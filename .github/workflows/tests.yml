
name: Django API Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install Django djangorestframework psycopg[binary] django-environ drf-spectacular pytest pytest-django

      - name: Run Django system checks
        run: python manage.py check

      - name: Run appointment API tests
        run: python manage.py test appointments
